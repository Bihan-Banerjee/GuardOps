# k8s/argocd/app-prod.yaml
#
# Phase 10: ArgoCD Application — prod
#
# Manages the guardops-app Helm release in the default (prod) namespace.
#
# SYNC STRATEGY: auto-sync DISABLED
#   Prod deploys require an explicit sync trigger. The CI pipeline does this
#   via `guardops sync-status --env prod --wait` after the DAST gate passes.
#   This means no commit can silently change prod — there is always an
#   operator-visible CI step that triggers the ArgoCD reconciliation.
#
# VALUES OVERLAY STACK (applied in order, last wins):
#   values.yaml                — local dev defaults (base)
#   values-prod.yaml           — prod overrides (TLS, replicas=2, HPA, ZAP enabled)
#   values-override-prod.yaml  — auto-generated by guardops deploy (image tag only)
#
# values-override-prod.yaml is committed by guardops deploy --gitops and contains:
#   image:
#     repository: <ecr-registry>/guardops-app
#     tag: "<git-sha>"
#     pullPolicy: Always
#
# ignoreDifferences on the image field:
#   Without this, ArgoCD would show OutOfSync immediately after a direct Helm
#   deploy (Step 4 of the pipeline) because the live image differs from whatever
#   is currently in the override file. The ignoreDifferences block tells ArgoCD
#   to ignore the container image field in the live Deployment spec — the override
#   file is the source of truth that ArgoCD reconciles toward on its next sync.
#
# Apply (standalone, without Terraform):
#   kubectl apply -f k8s/argocd/project.yaml     # AppProject must exist first
#   kubectl apply -f k8s/argocd/app-prod.yaml
# Check:
#   kubectl get application guardops-app-prod -n argocd
#   argocd app get guardops-app-prod
#   argocd app history guardops-app-prod

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guardops-app-prod
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: guardops
    guardops.io/env: prod
    guardops.io/phase: "10"
  # Prevent accidental deletion of the Application from removing prod resources.
  # ArgoCD will cascade-delete all managed resources before removing the Application.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: guardops

  source:
    repoURL: https://github.com/Bihan-Banerjee/GuardOps
    targetRevision: HEAD
    path: k8s/helm/guardops-app
    helm:
      # Each file is applied in order; later files override earlier ones.
      # values-override-prod.yaml is last so its image tag always wins.
      valueFiles:
        - values.yaml
        - values-prod.yaml
        - values-override-prod.yaml
      # Must match the release name used by deploy_cmd.py / deployer.py
      # so ArgoCD and guardops deploy agree on which Helm release to manage.
      releaseName: guardops-app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    # No `automated:` block = auto-sync disabled for prod.
    # ArgoCD monitors for drift but does NOT apply changes automatically.
    # Sync is triggered by: guardops sync-status --env prod --wait
    # or via: argocd app sync guardops-app-prod
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      # Server-side apply avoids annotation size limits on large resources
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m

  ignoreDifferences:
    # Ignore the live image field — deploy_cmd.py updates it via direct Helm
    # before the GitOps commit lands. Without this, ArgoCD would show OutOfSync
    # during the window between the Helm deploy and the ArgoCD sync completing.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
