# k8s/observability/prometheus-values.yaml
#
# Lean kube-prometheus-stack configuration for GuardOps EKS (single t3.large node).
#
# Install command (run BEFORE deploying guardops-app with monitoring.enabled=true):
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring \
#     --create-namespace \
#     --values k8s/observability/prometheus-values.yaml \
#     --timeout 10m \
#     --wait
#
# Resources used on the node (approximate):
#   Prometheus server:    300MB RAM, 0.1 CPU
#   Grafana:              150MB RAM, 0.05 CPU
#   Alertmanager:         50MB  RAM, 0.02 CPU
#   kube-state-metrics:   80MB  RAM, 0.05 CPU
#   node-exporter:        30MB  RAM, 0.02 CPU
#   Total addition:       ~610MB RAM on the t3.large (8GB) — comfortable.
#
# Data retention:
#   Prometheus: 7 days (default is 10 days — reduced to save EBS space)
#   Storage:    5Gi PVC on gp2 (EBS CSI driver required — enabled in Phase 5 Terraform)

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: "4GB"

    # Tell Prometheus to discover ALL ServiceMonitors in ALL namespaces.
    # Without this, it only scrapes monitors in its own namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # Same for PodMonitors
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 300m

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2       # default EBS storage class on EKS
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true

  # CHANGE THIS before running in prod — or rotate immediately after first login
  adminPassword: "guardops-grafana-2024"

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

  persistence:
    enabled: true
    storageClassName: gp2
    size: 2Gi

  # Pre-load the Kubernetes cluster dashboard (ID 15757 from grafana.com)
  # and the Node Exporter Full dashboard (ID 1860)
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 15757
        revision: 37
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

  service:
    type: ClusterIP           # access via kubectl port-forward, not LoadBalancer

# ── Alertmanager ─────────────────────────────────────────────────────────────
alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        memory: 50Mi
        cpu: 20m
      limits:
        memory: 128Mi
        cpu: 100m

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

# ── kube-state-metrics ────────────────────────────────────────────────────────
kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
      cpu: 20m
    limits:
      memory: 128Mi
      cpu: 100m

# ── node-exporter ─────────────────────────────────────────────────────────────
prometheus-node-exporter:
  resources:
    requests:
      memory: 30Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 50m
