# k8s/dashboard/deployment.yaml — Phase 13
#
# ServiceAccount + minimal RBAC + Deployment for the GuardOps web dashboard.
#
# RBAC: the /api/v1/quarantine route runs `kubectl get pods/networkpolicy` using
# the pod's ServiceAccount token, so the SA needs read-only access to those.
# Everything else (findings, metrics, runtime, sync) is HTTP/S3 and needs no k8s API.
#
# S3 read access (for the findings backend) is granted to this ServiceAccount via
# IRSA — annotate it with an IAM role ARN that can s3:GetObject on the metadata
# bucket. The placeholder __ECR_IMAGE__ is substituted by scripts/setup-dashboard.ps1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardops-dashboard
  namespace: default
  labels:
    app.kubernetes.io/name: guardops-dashboard
    app.kubernetes.io/managed-by: guardops
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::236796665744:role/guardops-dashboard-s3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guardops-dashboard-reader
  labels:
    app.kubernetes.io/name: guardops-dashboard
    app.kubernetes.io/managed-by: guardops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guardops-dashboard-reader
  labels:
    app.kubernetes.io/name: guardops-dashboard
    app.kubernetes.io/managed-by: guardops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guardops-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: guardops-dashboard
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardops-dashboard
  namespace: default
  labels:
    app.kubernetes.io/name: guardops-dashboard
    app.kubernetes.io/managed-by: guardops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guardops-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guardops-dashboard
    spec:
      serviceAccountName: guardops-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: dashboard
          image: "__ECR_IMAGE__"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: guardops-dashboard-config
            - secretRef:
                name: guardops-dashboard-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
