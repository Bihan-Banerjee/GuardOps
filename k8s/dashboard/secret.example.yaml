# k8s/dashboard/secret.example.yaml — Phase 13
#
# TEMPLATE ONLY — do not commit real credentials. Copy to secret.yaml, fill in
# values, and apply it yourself (secret.yaml is gitignored). scripts/setup-dashboard.ps1
# can also create this Secret for you from parameters.
#
# Auth model (matches backend/dashboard/auth.py):
#   - basic mode (default in configmap): GUARDOPS_DASHBOARD_USER + _PASSWORD.
#     A browser hitting app.guardops.live gets a native login prompt.
#   - token mode: set GUARDOPS_DASHBOARD_TOKEN and AUTH_MODE=token in the ConfigMap.
#
# GUARDOPS_ARGOCD_TOKEN is optional — only needed for the /api/v1/sync-status route.
apiVersion: v1
kind: Secret
metadata:
  name: guardops-dashboard-secret
  namespace: default
  labels:
    app.kubernetes.io/name: guardops-dashboard
    app.kubernetes.io/managed-by: guardops
type: Opaque
stringData:
  GUARDOPS_DASHBOARD_USER: "admin"
  GUARDOPS_DASHBOARD_PASSWORD: "change-me-to-a-strong-password"
  # GUARDOPS_DASHBOARD_TOKEN: "set-this-instead-for-token-auth-mode"
  GUARDOPS_ARGOCD_TOKEN: ""
