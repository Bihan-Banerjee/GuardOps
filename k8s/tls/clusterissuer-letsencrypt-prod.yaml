# k8s/tls/clusterissuer-letsencrypt-prod.yaml
#
# Phase 10: Let's Encrypt PRODUCTION ClusterIssuer
#
# PURPOSE:
#   Issues real, browser-trusted TLS certificates for guardops.live,
#   staging.guardops.live, and argocd.guardops.live.
#
# RATE LIMITS (IMPORTANT):
#   - 5 duplicate certificates per registered domain per week
#   - 50 certificates per registered domain per week (total)
#   - Exceeding limits causes ACME errors; recovery requires waiting until
#     the window resets. Always use letsencrypt-staging first.
#   - Rate limit dashboard: https://tools.letsdebug.net/
#
# SWITCH FROM STAGING TO PROD:
#   Once letsencrypt-staging confirms cert issuance works (Certificate Ready=True):
#   1. Apply this file:
#        kubectl apply -f k8s/tls/clusterissuer-letsencrypt-prod.yaml
#   2. In values-prod.yaml and values-staging.yaml, change:
#        cert-manager.io/cluster-issuer: "letsencrypt-staging"
#      to:
#        cert-manager.io/cluster-issuer: "letsencrypt-prod"
#   3. Delete the old staging-issued Secret to force renewal:
#        kubectl delete secret guardops-prod-tls -n default
#        kubectl delete secret guardops-staging-tls -n staging
#   4. Redeploy — cert-manager will issue new prod certificates.
#   5. Verify in browser: https://guardops.live — padlock should be green.
#
# AUTO-RENEWAL:
#   cert-manager renews certificates automatically when they have less than
#   30 days remaining (Let's Encrypt certs are valid for 90 days).
#   No manual intervention needed after initial issuance.
#
# Apply:
#   kubectl apply -f k8s/tls/clusterissuer-letsencrypt-prod.yaml
# Check:
#   kubectl describe clusterissuer letsencrypt-prod
#   kubectl get certificate -A                   # all namespaces
#   kubectl describe certificate -n default      # prod cert detail
#   kubectl describe certificate -n staging      # staging cert detail

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/managed-by: guardops
    guardops.io/phase: "10"
spec:
  acme:
    # Let's Encrypt PRODUCTION directory — real, browser-trusted certificates
    server: https://acme-v02.api.letsencrypt.org/directory

    email: bihanbanerjee26@gmail.com

    privateKeySecretRef:
      name: letsencrypt-prod-account-key

    solvers:
      - http01:
          ingress:
            ingressClassName: alb
