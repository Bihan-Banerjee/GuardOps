# k8s/helm/guardops-app/values-prod.yaml
#
# Phase 10: Production overrides
#
# Applied ON TOP of values.yaml by:
#   - guardops deploy --env prod (direct Helm via --values values-prod.yaml)
#   - ArgoCD Application guardops-app-prod (helm.valueFiles stack)
#
# After values-prod.yaml, ArgoCD also applies values-override-prod.yaml which
# contains only image.repository and image.tag (written by guardops deploy --gitops).
# That override file is the source of truth for what image is deployed.
#
# Changes from values.yaml defaults:
#   - image.pullPolicy: Always   (pull from ECR on every pod restart)
#   - replicaCount: 2            (HA — two pods behind the service)
#   - resources: higher limits   (production workload)
#   - ingress.host: guardops.live (real domain)
#   - ingress.tls: true          (HTTPS via cert-manager + Let's Encrypt)
#   - ingress.certManagerClusterIssuer: letsencrypt-prod
#   - hpa.enabled: true          (autoscale 2-6 replicas at 70% CPU)
#   - monitoring.enabled: true   (Prometheus scraping)
#   - config.ENVIRONMENT: prod

# ---------------------------------------------------------------------------
# Container image
# ---------------------------------------------------------------------------
image:
  # repository and tag are overridden by values-override-prod.yaml
  # which is written by guardops deploy --gitops on each pipeline run.
  # Defaults here are only used if the override file has never been committed.
  repository: ""      # set by guardops deploy: <account>.dkr.ecr.<region>.amazonaws.com/guardops-app
  tag: "latest"       # set by values-override-prod.yaml: <git-sha>
  pullPolicy: Always  # always pull from ECR on pod restart

# ---------------------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------------------
replicaCount: 2   # HA: two pods so rolling updates have no downtime

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# ---------------------------------------------------------------------------
# Ingress — prod domain with ACM TLS (terminated at the ALB)
# ---------------------------------------------------------------------------
# WHY ACM, not cert-manager:
#   An AWS ALB terminates HTTPS itself and can ONLY use an AWS ACM certificate —
#   it cannot read a Kubernetes Secret (that is an nginx-ingress pattern). So the
#   TLS cert is a DNS-validated ACM cert (covers guardops.live + *.guardops.live),
#   referenced by ARN below. Provision once with:
#     aws acm request-certificate --domain-name guardops.live \
#       --subject-alternative-names "*.guardops.live" --validation-method DNS \
#       --region ap-south-1
#   then add the returned validation CNAME to the Route53 zone and wait for
#   Status=ISSUED. The ALB controller attaches the cert to the :443 listener.
ingress:
  enabled: true
  className: alb

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # ACM certificate for guardops.live + *.guardops.live (ap-south-1).
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:236796665744:certificate/9068b1dc-6273-45ac-9076-051e1397e326"

  host: guardops.live

  # TLS is terminated at the ALB using the ACM cert above — no K8s TLS Secret.
  tls: false
  tlsSecret: ""

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# ---------------------------------------------------------------------------
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
monitoring:
  enabled: true
  port: 8080
  path: /metrics
  scrapeInterval: 30s

# ---------------------------------------------------------------------------
# Application config
# ---------------------------------------------------------------------------
config:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "prod"
  PORT: "8080"
