# values-prod.yaml — Production overrides for AWS EKS
# Applied ON TOP of values.yaml when running `guardops deploy --env prod`
# Only specify values that DIFFER from local defaults.

image:
  repository: ""
  tag: ""
  pullPolicy: Always          # always pull from ECR in production

replicaCount: 2               # minimum 2 for high availability

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  host: app.yourdomain.com
  tls: true
  tlsSecret: guardops-app-tls

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

config:
  LOG_LEVEL: "WARNING"
  ENVIRONMENT: "production"
  PORT: "8080"

# ---------------------------------------------------------------------------
# PHASE 5: Monitoring enabled in production
# ---------------------------------------------------------------------------
# kube-prometheus-stack is installed on EKS (see scripts/setup-observability.ps1).
# This enables:
#   - Prometheus scrape annotations on the pod
#   - ServiceMonitor CRD pointing Prometheus at /metrics
# Grafana dashboard: import k8s/observability/grafana-dashboard.json
monitoring:
  enabled: false
  port: 8080
  path: /metrics
  scrapeInterval: 30s
