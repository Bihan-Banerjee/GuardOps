apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guardops-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardops-app.labels" . | nindent 4 }}
    {{- if .Values.blueGreen.enabled }}
    guardops.io/slot: {{ .Values.blueGreen.slot | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "guardops-app.selectorLabels" . | nindent 6 }}
      {{- if .Values.blueGreen.enabled }}
      # The slot label is included in the selector so each slot's Deployment
      # only controls its own pods. Without this, two slot Deployments in the
      # same namespace would fight over each other's pods.
      guardops.io/slot: {{ .Values.blueGreen.slot | quote }}
      {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "guardops-app.selectorLabels" . | nindent 8 }}
        {{- if .Values.blueGreen.enabled }}
        # Pod-level slot label — this is what the shared traffic Service
        # (managed by `guardops switch`) uses as its selector.
        # The traffic Service selects:
        #   app.kubernetes.io/name: <chart-name>   ← from selectorLabels above
        #   guardops.io/slot: blue|green            ← this label
        # Together they route traffic to the active slot's pods only.
        guardops.io/slot: {{ .Values.blueGreen.slot | quote }}
        {{- end }}
      annotations:
        # Force pod restart when ConfigMap changes (Helm doesn't do this automatically)
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # ── PHASE 5: Prometheus scrape annotations ──────────────────────────────
        {{- if .Values.monitoring.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.monitoring.port | quote }}
        prometheus.io/path: {{ .Values.monitoring.path | quote }}
        {{- end }}
        {{- if .Values.blueGreen.enabled }}
        # Record which slot this Deployment belongs to for debugging.
        guardops.io/blue-green-slot: {{ .Values.blueGreen.slot | quote }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "guardops-app.name" . }}
          image: {{ include "guardops-app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if .Values.monitoring.enabled }}
            - name: metrics
              containerPort: {{ .Values.monitoring.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "guardops-app.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
