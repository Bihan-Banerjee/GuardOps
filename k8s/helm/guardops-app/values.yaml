# values.yaml — Local development defaults (k3d)
# These are the base values used when running `guardops deploy --env local`
# Staging overrides live in values-staging.yaml
# Production overrides live in values-prod.yaml

# ---------------------------------------------------------------------------
# Application identity
# ---------------------------------------------------------------------------
app:
  name: guardops-app          # overridden by guardops at deploy time
  version: latest             # overridden with git SHA by guardops

# ---------------------------------------------------------------------------
# Container image
# ---------------------------------------------------------------------------
image:
  repository: guardops-app   # overridden at deploy time
  tag: latest                 # overridden with git SHA at deploy time
  # Never = use locally imported image (k3d requirement)
  # Always = pull from registry (ECR in staging/prod)
  pullPolicy: Never

# ---------------------------------------------------------------------------
# Pod security context
# ---------------------------------------------------------------------------
# UID/GID must match the non-root user baked into the image.
# test-project/Dockerfile creates "appuser" with a fixed UID of 10001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

# ---------------------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------------------
replicaCount: 1

# Resource requests/limits — minimums for local dev
# Staging and prod override to higher values in their respective values files
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# ---------------------------------------------------------------------------
# Health probes
# ---------------------------------------------------------------------------
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  # Local k3d uses the nginx ingress controller (see scripts/setup-local.sh).
  # Staging/prod override this to "alb" in their values-<env>.yaml for the
  # AWS Load Balancer Controller on EKS.
  className: nginx
  annotations: {}
  host: test-app.local
  tls: false
  tlsSecret: ""

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# ---------------------------------------------------------------------------
hpa:
  enabled: false           # disabled locally — not enough resources
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Application config (injected as env vars via ConfigMap)
# ---------------------------------------------------------------------------
config:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "local"
  PORT: "8080"

# ---------------------------------------------------------------------------
# Container port
# ---------------------------------------------------------------------------
containerPort: 8080

# ---------------------------------------------------------------------------
# PHASE 5: Monitoring (Prometheus scraping)
# ---------------------------------------------------------------------------
monitoring:
  enabled: false            # true in values-prod.yaml
  port: 8080
  path: /metrics
  scrapeInterval: 30s

# ---------------------------------------------------------------------------
# PHASE 9: Blue-Green deployment
# ---------------------------------------------------------------------------
# Controls slot-based traffic switching via `guardops switch`.
#
# When blueGreen.enabled = true (set automatically by `guardops deploy --slot`):
#   - The pod template gains label  guardops.io/slot: <slot>
#   - The Deployment selector also matches on that label so each slot's
#     Deployment only controls its own pods
#
# guardops switch --slot green patches a SHARED traffic Service (not owned
# by this Helm release) to select pods with guardops.io/slot=green.
# The shared Service is created by `guardops switch` on first use.
#
# This section is intentionally disabled by default (enabled: false, slot: "").
# guardops deploy --slot blue/green sets these via --set on the helm upgrade
# command so the values file itself never needs to be edited for blue-green.
blueGreen:
  enabled: false   # set to true by guardops deploy --slot <slot>
  slot: ""         # "blue" | "green" — set by guardops deploy --slot <slot>
