# k8s/helm/guardops-app/values-staging.yaml
#
# Phase 10: Staging overrides
#
# Applied ON TOP of values.yaml by:
#   - guardops deploy --env staging (direct Helm via --values values-staging.yaml)
#   - ArgoCD Application guardops-app-staging (helm.valueFiles stack)
#
# After this file, ArgoCD also applies values-override-staging.yaml which
# contains only image.repository and image.tag (written by guardops deploy --gitops).
#
# Key differences from prod:
#   - host: staging.guardops.dev  (subdomain, not apex)
#   - replicaCount: 1             (cost savings — staging doesn't need HA)
#   - hpa: disabled               (no autoscaling needed in staging)
#   - security.tools.owasp_zap: false (DAST disabled for staging — no stable URL)
#   - config.ENVIRONMENT: staging

# ---------------------------------------------------------------------------
# Container image
# ---------------------------------------------------------------------------
image:
  repository: ""      # set by values-override-staging.yaml on each deploy
  tag: "latest"       # set by values-override-staging.yaml: staging-<git-sha>
  pullPolicy: Always

# ---------------------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------------------
replicaCount: 1   # staging: single replica to save cost

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# ---------------------------------------------------------------------------
# Ingress — staging subdomain with Let's Encrypt TLS
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: alb

  certManagerClusterIssuer: letsencrypt-prod

  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

  host: staging.guardops.dev

  tls: true
  tlsSecret: guardops-staging-tls

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler — disabled for staging
# ---------------------------------------------------------------------------
hpa:
  enabled: false

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
monitoring:
  enabled: true
  port: 8080
  path: /metrics
  scrapeInterval: 30s

# ---------------------------------------------------------------------------
# Application config
# ---------------------------------------------------------------------------
config:
  LOG_LEVEL: "DEBUG"    # more verbose in staging to aid debugging
  ENVIRONMENT: "staging"
  PORT: "8080"
