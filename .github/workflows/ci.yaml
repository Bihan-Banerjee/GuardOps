# .github/workflows/ci.yaml
#
# GuardOps CI/CD Pipeline — Phase 3
#
# Jobs:
#   1. build-test      — lint, type-check, unit tests, coverage
#   2. sast            — Semgrep + Bandit source code scanning
#   3. container-scan  — Docker build + Trivy image scan + ECR push
#   4. deploy          — Helm upgrade to EKS (main branch only)
#   5. upload-reports  — Push scan reports to S3 (always runs)
#
# Security gates:
#   Job 2 blocks on HIGH+ SAST findings
#   Job 3 blocks on HIGH+ fixable container CVEs
#   Job 4 only runs if jobs 1-3 all pass AND branch is main
#   Job 5 always runs so reports are saved even when pipeline fails

name: GuardOps CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION:       us-east-1
  ECR_REGISTRY:     ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME:       guardops-app
  HELM_CHART_PATH:  k8s/helm/guardops-app
  K8S_NAMESPACE:    default

jobs:

  # ── Job 1: Build and Test ──────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check cli/ backend/

      - name: Type check with mypy
        run: mypy cli/ backend/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=cli --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Job 2: SAST ───────────────────────────────────────────────────────────
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and security tools
        run: |
          pip install -r requirements.txt
          pip install semgrep bandit

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep --config=auto \
            --json \
            --output=security/reports/semgrep.json \
            --exclude=.venv \
            --exclude=tests \
            . || true

      - name: Check Semgrep results — gate on HIGH+
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "security/reports/semgrep.json"
          if not os.path.exists(report_path):
              print("No semgrep report found — skipping gate")
              sys.exit(0)

          try:
              data = json.load(open(report_path))
          except Exception as e:
              print(f"Could not parse semgrep report: {e} — skipping gate")
              sys.exit(0)

          blocking = [
              r for r in data.get("results", [])
              if r.get("extra", {}).get("severity") in ("ERROR", "WARNING")
          ]

          if blocking:
              print(f"BLOCKED: {len(blocking)} HIGH/MEDIUM semgrep findings")
              for f in blocking:
                  print(
                      f"  {f['extra']['severity']}  "
                      f"{f['check_id']}  "
                      f"{f['path']}:{f['start']['line']}"
                  )
              sys.exit(1)

          total = len(data.get("results", []))
          print(f"OK: {total} total semgrep findings, none blocking")
          EOF

      - name: Run Bandit
        run: |
          bandit -r . \
            --exclude .venv,tests \
            -f json \
            -o security/reports/bandit.json \
            -l || true

      - name: Check Bandit results — gate on HIGH confidence HIGH severity
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "security/reports/bandit.json"
          if not os.path.exists(report_path):
              print("No bandit report found — skipping gate")
              sys.exit(0)

          try:
              data = json.load(open(report_path))
          except Exception as e:
              print(f"Could not parse bandit report: {e} — skipping gate")
              sys.exit(0)

          blocking = [
              r for r in data.get("results", [])
              if r.get("issue_severity") == "HIGH"
              and r.get("issue_confidence") != "LOW"
          ]

          if blocking:
              print(f"BLOCKED: {len(blocking)} HIGH-confidence HIGH-severity bandit findings")
              for f in blocking:
                  print(
                      f"  {f['issue_severity']} ({f['issue_confidence']})  "
                      f"{f['test_id']}  "
                      f"{f['filename']}:{f['line_number']}  "
                      f"{f['issue_text']}"
                  )
              sys.exit(1)

          total = len(data.get("results", []))
          print(f"OK: {total} total bandit findings, none blocking")
          EOF

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN not set — skipping SonarQube"
            exit 0
          fi
          pip install -e . --quiet
          python - <<'EOF'
          import os, sys
          from backend.security.sonarqube_runner import run_sonarqube, check_quality_gate

          result = run_sonarqube(".", {})
          if result.skipped:
              print(f"SonarQube skipped: {result.skip_reason}")
              sys.exit(0)

          if not result.success:
              print(f"SonarQube analysis failed: {result.error_message}")
              sys.exit(1)

          passed, message = check_quality_gate({})
          if not passed:
              print(f"BLOCKED: SonarQube quality gate FAILED: {message}")
              sys.exit(1)

          print(f"OK: SonarQube quality gate passed")
          EOF

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: security/reports/

  # ── Job 3: Container Scan + ECR Push ──────────────────────────────────────
  container-scan:
    name: Container Scan & Push
    runs-on: ubuntu-latest
    needs: sast
    outputs:
      image-tag:      ${{ steps.meta.outputs.tag }}
      full-image-ref: ${{ steps.meta.outputs.full_ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          TAG=$(git rev-parse --short HEAD)
          FULL_REF="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}"           >> $GITHUB_OUTPUT
          echo "full_ref=${FULL_REF}" >> $GITHUB_OUTPUT
          echo "Image will be: ${FULL_REF}"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -f Dockerfile \
            .

      - name: Install Trivy
        run: |
          wget -qO- \
            https://github.com/aquasecurity/trivy/releases/download/v0.51.1/trivy_0.51.1_Linux-64bit.tar.gz \
            | tar xz -C /usr/local/bin trivy
          trivy --version

      - name: Run Trivy container scan
        run: |
          mkdir -p security/reports
          trivy image \
            --format json \
            --output security/reports/trivy-image.json \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} || true

      - name: Check Trivy results — gate on fixable HIGH/CRITICAL CVEs
        run: |
          python3 - <<'EOF'
          import json, sys, os

          report_path = "security/reports/trivy-image.json"
          if not os.path.exists(report_path):
              print("No trivy report found — skipping gate")
              sys.exit(0)

          try:
              data = json.load(open(report_path))
          except Exception as e:
              print(f"Could not parse trivy report: {e} — skipping gate")
              sys.exit(0)

          blocking = []
          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities") or []:
                  sev = vuln.get("Severity", "")
                  fix = vuln.get("FixedVersion", "")
                  if sev in ("HIGH", "CRITICAL") and fix:
                      blocking.append(vuln)

          if blocking:
              print(f"BLOCKED: {len(blocking)} fixable HIGH/CRITICAL CVEs found")
              for v in blocking[:10]:
                  print(
                      f"  {v['Severity']}  "
                      f"{v['VulnerabilityID']}  "
                      f"{v['PkgName']}@{v['InstalledVersion']}  "
                      f"fix: {v['FixedVersion']}"
                  )
              if len(blocking) > 10:
                  print(f"  ... and {len(blocking) - 10} more")
              sys.exit(1)

          print(f"OK: no fixable HIGH/CRITICAL CVEs")
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login \
                --username AWS \
                --password-stdin \
                ${{ env.ECR_REGISTRY }}

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.IMAGE_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null \
          || aws ecr create-repository \
              --repository-name ${{ env.IMAGE_NAME }} \
              --region ${{ env.AWS_REGION }}

      - name: Tag and push to ECR
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            ${{ steps.meta.outputs.full_ref }}
          docker push ${{ steps.meta.outputs.full_ref }}
          echo "Successfully pushed: ${{ steps.meta.outputs.full_ref }}"

      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-report
          path: security/reports/trivy-image.json

  # ── Job 4: Helm Deploy to EKS ─────────────────────────────────────────────
  deploy:
    name: Deploy to EKS (Helm)
    runs-on: ubuntu-latest
    needs: container-scan
    # Only deploy on direct pushes to main — not on PRs, not on develop
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # requires manual approval if configured in GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name guardops-prod-cluster

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.17.0"

      - name: Helm lint — validate chart before deploying
        run: |
          helm lint ${{ env.HELM_CHART_PATH }} \
            --set image.repository=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.container-scan.outputs.image-tag }}

      - name: Deploy with Helm
        run: |
          IMAGE_REPO="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG="${{ needs.container-scan.outputs.image-tag }}"

          helm upgrade --install guardops-app \
            ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=Always \
            -f ${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --wait

          echo "Helm release status:"
          helm status guardops-app --namespace ${{ env.K8S_NAMESPACE }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/guardops-app \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

          echo ""
          echo "Pod status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

          echo ""
          echo "Helm history:"
          helm history guardops-app --namespace ${{ env.K8S_NAMESPACE }}

  # ── Job 5: Upload Reports to S3 ───────────────────────────────────────────
  upload-reports:
    name: Upload Reports to S3
    runs-on: ubuntu-latest
    needs: [sast, container-scan]
    # Always runs — even when earlier jobs fail — so reports are never lost
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports/
        continue-on-error: true   # don't fail if no artifacts were produced

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Upload reports to S3
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          S3_PREFIX="s3://${{ secrets.GUARDOPS_S3_BUCKET }}/reports/${REPO}/${BRANCH}/${SHA}"

          if [ -d "all-reports" ] && [ "$(ls -A all-reports)" ]; then
            aws s3 cp all-reports/ "${S3_PREFIX}/" \
              --recursive \
              --no-progress
            echo "Reports uploaded to: ${S3_PREFIX}/"
          else
            echo "No reports to upload"
          fi