# .github/workflows/ci.yaml
#
# GuardOps CI/CD Pipeline — Phase 11
#
# Jobs:
#   1. build-test      — lint, type-check, unit tests, coverage
#   2. sast            — Semgrep + Bandit + SonarQube source code scanning
#   3. container-scan  — Docker build + Trivy scan + ECR push + SBOM + cosign keyless sign (Phase 11)
#   4. deploy          — Helm upgrade to EKS + OWASP ZAP DAST + GitOps override commit (Phase 10)
#   5. runtime-gate    — Falco alert check via Loki (Phase 7)
#   6. upload-reports  — Push scan reports to S3 (always runs if AWS role exists)
#   7. sync-gate       — ArgoCD Synced + Healthy confirmation (Phase 10)
#
# Security gates:
#   Job 2 blocks on HIGH+ SAST findings
#   Job 3 blocks on HIGH+ fixable container CVEs
#   Job 4 only runs if jobs 1-3 all pass AND branch is main AND EKS exists
#   Job 5 only runs if deploy passed AND HAS_FALCO_ENABLED is true
#   Job 6 always runs so reports are saved even when pipeline fails
#   Job 7 only runs if deploy passed AND ARGOCD_TOKEN secret is set (Phase 10)
#
# Phase 10 changes:
#   Job 4 (deploy) — two new steps at the end of the job:
#     "Write GitOps image override + trigger ArgoCD (prod)" — commits
#     values-override-prod.yaml and triggers ArgoCD sync.
#     "Write GitOps image override (staging)" — commits
#     values-override-staging.yaml so ArgoCD auto-sync picks it up.
#     Both steps gated by HAS_ARGOCD job-level env var (hoisted from
#     ARGOCD_TOKEN secret — secrets context not allowed in step if:).
#   Job 7 (sync-gate) — NEW — polls guardops sync-status --env prod --wait
#     until ArgoCD reports Synced + Healthy or times out at 300s.
#     Skipped gracefully if ARGOCD_TOKEN is not set.
#   deploy job permissions — added contents: write for GitOps push.
#   deploy job checkout — added token + fetch-depth: 0 for GitOps push.
#
# Phase 11 changes — Supply chain (SBOM + Cosign keyless signing):
#   Job 3 (container-scan) — after the ECR push, new steps:
#     - capture the pushed image's sha256 digest (sign the digest, not the tag)
#     - generate a Syft SBOM (CycloneDX + SPDX), upload as artifact + to S3
#     - cosign keyless sign the image by digest, and attest the SBOMs +
#       SLSA-style provenance (Sigstore: Fulcio cert + Rekor transparency log)
#   No NEW secrets are required: keyless signing reuses the job's existing
#   `id-token: write` OIDC token, and the existing AWS_ROLE_ARN already grants
#   the ECR write needed to store the cosign .sig/.att artifacts. The Rekor
#   entry is public and contains only the image digest + the repo workflow
#   identity (no source, no secrets).
#   Kyverno (enable_kyverno) verifies these signatures at admission on EKS —
#   see infra/terraform/modules/kyverno and k8s/kyverno/.
#
# Phase 7 change — Falco runtime gate added:
#   After Helm deploy, port-forwards Loki and queries for CRITICAL Falco
#   alerts fired during the deploy window (last 30m). Rolls back if found.
#   Gated by HAS_FALCO_ENABLED secret — safe to add without breaking existing runs.
#
# Phase 6 change — GitHub OIDC replaces static IAM user credentials:
#   AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are REMOVED.
#   configure-aws-credentials now uses role-to-assume with a short-lived token.
#   Each job that calls AWS declares:  permissions: id-token: write
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN            — from `terraform output github_actions_role_arn`
#   AWS_ACCOUNT_ID          — your 12-digit account ID
#   GUARDOPS_S3_BUCKET      — bucket name from `terraform output s3_reports_bucket_name`
#   HAS_ZAP_ENABLED         — set to "true" to enable Phase 6 DAST steps
#   HAS_FALCO_ENABLED       — set to "true" to enable Phase 7 runtime gate
#   ARGOCD_TOKEN            — ArgoCD API token for GitOps steps (Phase 10)
#                             Generate: argocd account generate-token --account admin
#                             Store:    gh secret set ARGOCD_TOKEN --body "<token>"
#   SEMGREP_APP_TOKEN       — optional, for Semgrep cloud dashboard
#   SONAR_TOKEN             — optional, for SonarQube
#   SONAR_HOST_URL          — optional, for SonarQube
#   PYPI_API_TOKEN          — optional, for publishing to PyPI
#
# Required GitHub Variables (non-secret feature flags):
#   HAS_EKS_CLUSTER         — set to "true" when EKS is provisioned
#   HAS_AWS_ROLE            — set to "true" when OIDC terraform applied
#
# Secrets you can DELETE after applying Phase 6:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY

name: GuardOps CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_NAME: guardops-app
  HELM_CHART_PATH: k8s/helm/guardops-app
  K8S_NAMESPACE: default

jobs:

  # ── Job 1: Build and Test (cross-platform) ──────────────────────────────────
  # The CLI ships to Linux/macOS/Windows users, so the test suite runs on all
  # three to catch path/subprocess assumptions. Lint + type-check are platform-
  # independent, so they run once (Linux). `shell: bash` keeps every step portable
  # (GitHub's Windows runners ship Git Bash) so the line continuations below work.
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        if: matrix.os == 'ubuntu-latest'
        run: ruff check cli/ backend/

      - name: Type check with mypy
        if: matrix.os == 'ubuntu-latest'
        run: mypy cli/ backend/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=cli --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=71 \
            --tb=short

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Job 1b: Web dashboard (lint-free unit tests + build) ────────────────────
  # The SPA's live→snapshot fallback (the "URL works 24/7" fix) is covered by
  # Vitest; the build step guards the Three.js/Recharts bundle from regressions.
  web-test:
    name: Web Dashboard (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  # ── Job 2: SAST ──────────────────────────────────────────────────────────────
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and security tools
        run: |
          pip install -r requirements.txt
          pip install semgrep bandit

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep --config=auto \
            --json \
            --output=security/reports/semgrep.json \
            --exclude=.venv \
            --exclude=tests \
            . || true

      - name: Check Semgrep results — gate on HIGH+
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "security/reports/semgrep.json"
          if not os.path.exists(report_path):
              print("No semgrep report found — skipping gate")
              sys.exit(0)

          try:
              data = json.load(open(report_path))
          except Exception as e:
              print(f"Could not parse semgrep report: {e} — skipping gate")
              sys.exit(0)

          # Intentional dev-environment tradeoffs suppressed here.
          # Each entry is (check_id_substring, path_substring).
          # Documented in README.md Known Operational Notes.
          SUPPRESSED = [
              # ECR mutable tags — intentional: rolling webhook-latest tag
              ("aws-ecr-mutable-image-tags",                      "modules/ecr"),
              # EKS public endpoint — intentional: kubectl access from dev machine
              ("eks-public-endpoint-enabled",                     "modules/eks"),
              # EKS control plane logging — disabled to avoid CloudWatch costs in dev
              ("eks-insufficient-control-plane-logging",          "modules/eks"),
              # IAM CI user access key — legacy resource, OIDC is the active auth path
              ("no-iam-creds-exposure",                           "modules/iam/"),
              # CI policy allows S3 access for report uploads
              ("no-iam-data-exfiltration",                        "modules/iam/"),
              # OIDC role policy — short-lived tokens only, not long-lived creds
              ("no-iam-creds-exposure",                           "modules/iam_oidc"),
              # Public subnet map_public_ip — required for NAT gateway and ELB
              ("aws-subnet-has-public-ip-address",                "modules/vpc"),
              # DynamoDB bootstrap table — dev state lock, not prod data
              ("aws-dynamodb-table-unencrypted",                  "bootstrap/"),
              # Falco simulator — test log-emitting job, no securityContext needed
              ("allow-privilege-escalation-no-securitycontext",   "falco-simulator"),
              # Dashboard snapshot public read — intentional, opt-in (enable_public_snapshot),
              # scoped to the dashboard/* prefix only. reports/ and metadata/ stay private.
              ("public",                                          "modules/s3"),
              ("s3-bucket",                                       "modules/s3"),
          ]

          def is_suppressed(result):
              check_id = result.get("check_id", "")
              path     = result.get("path", "")
              return any(
                  rule in check_id and file_path in path
                  for rule, file_path in SUPPRESSED
              )

          all_findings = [
              r for r in data.get("results", [])
              if r.get("extra", {}).get("severity") in ("ERROR", "WARNING")
          ]

          suppressed = [r for r in all_findings if is_suppressed(r)]
          blocking   = [r for r in all_findings if not is_suppressed(r)]

          if suppressed:
              print(f"Suppressed {len(suppressed)} known intentional finding(s):")
              for f in suppressed:
                  print(
                      f"  [suppressed]  {f['extra']['severity']}  "
                      f"{f['check_id']}  "
                      f"{f['path']}:{f['start']['line']}"
                  )

          if blocking:
              print(f"BLOCKED: {len(blocking)} HIGH/MEDIUM semgrep findings")
              for f in blocking:
                  print(
                      f"  {f['extra']['severity']}  "
                      f"{f['check_id']}  "
                      f"{f['path']}:{f['start']['line']}"
                  )
              sys.exit(1)

          total = len(data.get("results", []))
          print(f"OK: {total} total findings, {len(suppressed)} suppressed, 0 blocking")
          EOF

      - name: Run Bandit
        run: |
          bandit -r . \
            --exclude .venv,venv,tests,infra,k8s,security,node_modules \
            -f json \
            -o security/reports/bandit.json \
            -l || true

      - name: Check Bandit results — gate on HIGH confidence HIGH severity
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "security/reports/bandit.json"
          if not os.path.exists(report_path):
              print("No bandit report found — skipping gate")
              sys.exit(0)

          try:
              data = json.load(open(report_path))
          except Exception as e:
              print(f"Could not parse bandit report: {e} — skipping gate")
              sys.exit(0)

          blocking = [
              r for r in data.get("results", [])
              if r.get("issue_severity") == "HIGH"
              and r.get("issue_confidence") != "LOW"
          ]

          if blocking:
              print(f"BLOCKED: {len(blocking)} HIGH-confidence HIGH-severity bandit findings")
              for f in blocking:
                  print(
                      f"  {f['issue_severity']} ({f['issue_confidence']})  "
                      f"{f['test_id']}  "
                      f"{f['filename']}:{f['line_number']}  "
                      f"{f['issue_text']}"
                  )
              sys.exit(1)

          total = len(data.get("results", []))
          print(f"OK: {total} total bandit findings, none blocking")
          EOF

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN not set — skipping SonarQube"
            exit 0
          fi

          pip install -e . --quiet

          python - <<'EOF'
          import os, sys
          from backend.security.sonarqube_runner import run_sonarqube, check_quality_gate

          result = run_sonarqube(".", {})

          if result.skipped:
              print(f"SonarQube skipped: {result.skip_reason}")
              sys.exit(0)

          if not result.success:
              print(f"SonarQube analysis failed: {result.error_message}")
              sys.exit(1)

          passed, message = check_quality_gate({})

          if not passed:
              print(f"BLOCKED: SonarQube quality gate FAILED: {message}")
              sys.exit(1)

          print("OK: SonarQube quality gate passed")
          EOF

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: security/reports/

  # ── Job 3: Container Scan + ECR Push ────────────────────────────────────────
  container-scan:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    needs: sast

    permissions:
      id-token: write
      contents: read

    env:
      HAS_AWS: ${{ secrets.AWS_ROLE_ARN != '' }}

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      image-digest: ${{ steps.digest.outputs.digest }}
      image-ref-digest: ${{ steps.digest.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHA}" >> $GITHUB_OUTPUT
          echo "full_ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            test-project/

      - name: Get current date for Trivy cache key
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Trivy image scan
        run: |
          trivy image \
            --format json \
            --output security/reports/trivy-image.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} || true

      - name: Check Trivy results — gate on fixable HIGH/CRITICAL
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "security/reports/trivy-image.json"
          if not os.path.exists(report_path):
              print("No trivy report found — skipping gate")
              sys.exit(0)

          try:
              data = json.load(open(report_path))
          except Exception as e:
              print(f"Could not parse trivy report: {e} — skipping gate")
              sys.exit(0)

          blocking = []
          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities") or []:
                  if (
                      vuln.get("Severity") in ("HIGH", "CRITICAL")
                      and vuln.get("FixedVersion")
                  ):
                      blocking.append(vuln)

          if blocking:
              print(f"BLOCKED: {len(blocking)} fixable HIGH/CRITICAL CVEs found")
              for v in blocking[:10]:
                  print(
                      f"  {v['Severity']}  "
                      f"{v['VulnerabilityID']}  "
                      f"{v['PkgName']}@{v['InstalledVersion']}  "
                      f"fix: {v['FixedVersion']}"
                  )
              if len(blocking) > 10:
                  print(f"  ... and {len(blocking) - 10} more")
              sys.exit(1)

          print("OK: no fixable HIGH/CRITICAL CVEs")
          EOF

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.HAS_AWS == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: guardops-container-scan-${{ github.run_id }}

      - name: Login to ECR
        if: ${{ env.HAS_AWS == 'true' }}
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login \
                --username AWS \
                --password-stdin \
                ${{ env.ECR_REGISTRY }}

      - name: Create ECR repository if it doesn't exist
        if: ${{ env.HAS_AWS == 'true' }}
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.IMAGE_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null \
          || aws ecr create-repository \
              --repository-name ${{ env.IMAGE_NAME }} \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region ${{ env.AWS_REGION }}

      # Phase 11: cosign-aware retention so image signatures (.sig/.att, which are
      # themselves tagged images) are not expired out from under a running image.
      - name: Ensure cosign-aware ECR lifecycle policy
        if: ${{ env.HAS_AWS == 'true' }}
        run: |
          aws ecr put-lifecycle-policy \
            --repository-name ${{ env.IMAGE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Expire untagged after 7 days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},"action":{"type":"expire"}},{"rulePriority":2,"description":"Keep last 25 images incl cosign artifacts","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":25},"action":{"type":"expire"}}]}' \
            || echo "::warning::could not set ECR lifecycle policy (missing ecr:PutLifecyclePolicy?) — continuing"

      - name: Tag and push to ECR
        if: ${{ env.HAS_AWS == 'true' }}
        run: |
          FULL_REF="${{ steps.meta.outputs.full_ref }}"

          docker tag \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            "${FULL_REF}"

          docker push "${FULL_REF}"

          LATEST_REF="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} "${LATEST_REF}"
          docker push "${LATEST_REF}"

          echo "Successfully pushed: ${FULL_REF}"
          echo "Also tagged latest: ${LATEST_REF}"

      # ── Phase 11: SBOM (Syft) ───────────────────────────────────────────────
      # Generated from the locally-built image so it runs even on fork PRs that
      # have no AWS role (HAS_AWS=false) and never push to ECR.
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM (CycloneDX + SPDX JSON)
        run: |
          syft "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" \
            -o cyclonedx-json=security/reports/sbom.cdx.json \
            -o spdx-json=security/reports/sbom.spdx.json
          echo "SBOM packages (CycloneDX):"
          grep -c '"bom-ref"' security/reports/sbom.cdx.json || true

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            security/reports/sbom.cdx.json
            security/reports/sbom.spdx.json
          if-no-files-found: warn

      # ── Phase 11: capture pushed digest (sign the digest, not the tag) ──────
      - name: Capture image digest from ECR
        id: digest
        if: ${{ env.HAS_AWS == 'true' }}
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ env.IMAGE_NAME }}" \
            --image-ids imageTag="${{ steps.meta.outputs.tag }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "describe-images returned no digest; falling back to imagetools"
            DIGEST=$(docker buildx imagetools inspect "${{ steps.meta.outputs.full_ref }}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')
          fi
          REF="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}"       >> "$GITHUB_OUTPUT"
          echo "Signing target: ${REF}"

      # ── Phase 11: Cosign keyless sign + SBOM/provenance attestations ────────
      - name: Install Cosign
        if: ${{ env.HAS_AWS == 'true' }}
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign keyless sign (by digest)
        if: ${{ env.HAS_AWS == 'true' }}
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "${{ steps.digest.outputs.ref }}"
          echo "Signed (keyless) — signature + Rekor entry created."

      - name: Cosign attest SBOMs (CycloneDX + SPDX)
        if: ${{ env.HAS_AWS == 'true' }}
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign attest --type cyclonedx \
            --predicate security/reports/sbom.cdx.json \
            "${{ steps.digest.outputs.ref }}"
          cosign attest --type spdxjson \
            --predicate security/reports/sbom.spdx.json \
            "${{ steps.digest.outputs.ref }}"

      - name: Cosign attest provenance (best-effort)
        if: ${{ env.HAS_AWS == 'true' }}
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cat > security/reports/provenance.json <<JSON
          {
            "buildType": "https://github.com/${{ github.repository }}/ci",
            "builder": { "id": "https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@${{ github.ref }}" },
            "invocation": { "configSource": { "uri": "git+https://github.com/${{ github.repository }}@${{ github.sha }}" } },
            "metadata": { "buildInvocationID": "${{ github.run_id }}" }
          }
          JSON
          cosign attest --type slsaprovenance \
            --predicate security/reports/provenance.json \
            "${{ steps.digest.outputs.ref }}" \
            || echo "::warning::provenance attestation failed — continuing"

      - name: Upload SBOM to S3 (per-digest)
        if: ${{ env.HAS_AWS == 'true' }}
        env:
          S3_BUCKET: ${{ secrets.GUARDOPS_S3_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${S3_BUCKET:-}" ]; then
            echo "GUARDOPS_S3_BUCKET unset — skipping SBOM S3 upload"
            exit 0
          fi
          SAFE_DIGEST=$(echo "${{ steps.digest.outputs.digest }}" | tr ':' '_')
          DEST="s3://${S3_BUCKET}/sbom/${{ env.IMAGE_NAME }}/${SAFE_DIGEST}/"
          aws s3 cp security/reports/sbom.cdx.json  "${DEST}" --no-progress
          aws s3 cp security/reports/sbom.spdx.json "${DEST}" --no-progress
          echo "Uploaded SBOM to ${DEST}"

      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-report
          path: security/reports/trivy-image.json

  # ── Job 4: Helm Deploy to EKS ─────────────────────────────────────────────
  deploy:
    name: Deploy to EKS (Helm)
    runs-on: ubuntu-latest
    needs: container-scan

    permissions:
      id-token: write
      contents: write   # Phase 10: needed so the GitOps override commit can push

    env:
      HAS_ZAP_ENABLED: ${{ secrets.HAS_ZAP_ENABLED }}
      # Phase 10: hoist ARGOCD_TOKEN existence to job-level env so step-level
      # if: conditions can reference it. secrets context is not allowed directly
      # inside step if: expressions — only job-level env: and job-level if: work.
      HAS_ARGOCD: ${{ secrets.ARGOCD_TOKEN != '' && 'true' || 'false' }}

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.HAS_EKS_CLUSTER == 'true'

    environment: production

    steps:
      # Phase 10: token + fetch-depth added.
      # token: GITHUB_TOKEN gives this job push access so the GitOps override
      # commit step can push values-override-prod.yaml back to origin/main.
      # fetch-depth: 0 gives the full git history so git rev-parse works.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: guardops-deploy-${{ github.run_id }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name guardops-prod-cluster

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.17.0"

      # Phase 10: GuardOps CLI install needed for the GitOps steps below.
      # Skipped in earlier jobs because they use direct tool invocations.
      # This job now uses `guardops deploy --gitops` to write and push the
      # values-override-<env>.yaml files.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GuardOps CLI
        run: pip install -e ".[dev]" --quiet

      - name: Helm lint — validate chart before deploying
        run: |
          helm lint ${{ env.HELM_CHART_PATH }} \
            --set image.repository=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.container-scan.outputs.image-tag }}

      - name: Deploy with Helm
        run: |
          IMAGE_REPO="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG="${{ needs.container-scan.outputs.image-tag }}"

          helm upgrade --install guardops-app \
            ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=Always \
            -f ${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --wait

          echo "Helm release status:"
          helm status guardops-app --namespace ${{ env.K8S_NAMESPACE }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/guardops-app \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

          echo ""
          echo "Pod status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

          echo ""
          echo "Helm history:"
          helm history guardops-app --namespace ${{ env.K8S_NAMESPACE }}

      # ── Phase 6: OWASP ZAP DAST ──────────────────────────────────────────

      - name: Port-forward app for ZAP
        if: ${{ env.HAS_ZAP_ENABLED == 'true' }}
        run: |
          kubectl port-forward \
            svc/${{ env.IMAGE_NAME }}-guardops-app \
            8090:80 \
            -n ${{ env.K8S_NAMESPACE }} &
          echo "PORT_FORWARD_PID=$!" >> $GITHUB_ENV
          sleep 8
          curl --silent --fail --retry 3 --retry-delay 3 \
            http://localhost:8090/healthz \
            && echo "Health check passed — proceeding to ZAP scan" \
            || (echo "::warning::Health check failed — ZAP may produce unreliable results" && true)

      - name: Run OWASP ZAP baseline scan
        if: ${{ env.HAS_ZAP_ENABLED == 'true' }}
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p security/reports
          docker run --rm \
            --network host \
            -v "$WORKSPACE/security/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8090 \
            -J zap-report.json \
            -r zap-report.html \
            -I \
            -l WARN \
          || true

      - name: Kill port-forward
        if: always() && env.HAS_ZAP_ENABLED == 'true'
        run: kill "$PORT_FORWARD_PID" 2>/dev/null || true

      - name: Upload ZAP report artifact
        if: always() && env.HAS_ZAP_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: security/reports/zap-report.*
          if-no-files-found: warn

      - name: Gate on DAST severity + auto-rollback on CRITICAL
        if: ${{ env.HAS_ZAP_ENABLED == 'true' }}
        run: |
          python3 - << 'PYEOF'
          import json
          import sys
          from pathlib import Path

          RISK_MAP = {3: "CRITICAL", 2: "HIGH", 1: "MEDIUM", 0: "LOW"}
          FAIL_ON = "CRITICAL"

          report_path = Path("security/reports/zap-report.json")

          if not report_path.exists():
              print("::error::ZAP JSON report not found. The scan may have failed to start.")
              sys.exit(1)

          try:
              data = json.loads(report_path.read_text())
          except json.JSONDecodeError as exc:
              print(f"::error::Could not parse ZAP report: {exc}")
              sys.exit(1)

          counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
          top_findings = []

          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  sev = RISK_MAP.get(int(alert.get("riskcode", 0)), "LOW")
                  counts[sev] += 1
                  if sev in ("CRITICAL", "HIGH"):
                      top_findings.append(f"  {sev}: {alert.get('alert', 'Unknown')}")

          print(
              f"DAST results — "
              f"CRITICAL: {counts['CRITICAL']}  "
              f"HIGH: {counts['HIGH']}  "
              f"MEDIUM: {counts['MEDIUM']}  "
              f"LOW: {counts['LOW']}"
          )

          if top_findings:
              print("Top findings (CRITICAL + HIGH):")
              for f in top_findings[:10]:
                  print(f)

          if counts[FAIL_ON] > 0:
              print(f"\n::error::ZAP DAST found {counts[FAIL_ON]} {FAIL_ON} findings.")
              print("::error::Triggering Helm rollback — see next step.")
              Path("/tmp/zap_critical_found").write_text(str(counts[FAIL_ON]))
              sys.exit(1)

          print("DAST gate passed — no CRITICAL findings.")
          PYEOF
        id: zap-gate
        continue-on-error: true

      - name: Auto-rollback on CRITICAL DAST findings
        if: steps.zap-gate.outcome == 'failure' && env.HAS_ZAP_ENABLED == 'true'
        env:
          K8S_NS: ${{ env.K8S_NAMESPACE }}
        run: |
          echo "Rolling back Helm release due to CRITICAL DAST findings..."
          helm rollback guardops-app 0 \
            --namespace "$K8S_NS" \
            --wait \
            --timeout 3m
          echo "Rollback complete. Helm history after rollback:"
          helm history guardops-app --namespace "$K8S_NS"
          echo "::error::Deployment rolled back due to CRITICAL DAST findings."
          exit 1

      # ── Phase 10: GitOps image override commit ────────────────────────────
      #
      # These two steps run AFTER the Helm deploy succeeds (and after DAST
      # passes). They write values-override-<env>.yaml with the new image tag,
      # commit it with [skip ci] so this push does not re-trigger the pipeline,
      # and push to origin/main.
      #
      # For prod: also triggers an explicit ArgoCD sync via the REST API,
      # since prod has auto-sync disabled in the ArgoCD Application spec.
      # For staging: the commit push is sufficient — staging has auto-sync
      # enabled and will reconcile within ~3 minutes on its own.
      #
      # Both steps are gated by HAS_ARGOCD (hoisted from ARGOCD_TOKEN secret).
      # If ARGOCD_TOKEN is not set, these steps are skipped and the pipeline
      # passes normally — GitOps is additive, not required.

      - name: Write GitOps image override + trigger ArgoCD (prod)
        if: env.HAS_ARGOCD == 'true'
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          guardops deploy \
            --env prod \
            --skip-scan \
            --skip-build \
            --skip-dast \
            --gitops \
            --gitops-branch main

      - name: Write GitOps image override (staging)
        if: env.HAS_ARGOCD == 'true'
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          guardops deploy \
            --env staging \
            --skip-scan \
            --skip-build \
            --skip-dast \
            --gitops \
            --gitops-branch main

  # ── Job 5: Runtime Security Gate (Phase 7) ──────────────────────────────────
  #
  # Runs AFTER a successful deploy. Port-forwards Loki and queries for any
  # CRITICAL Falco alerts that fired during the deploy window (last 30 min).
  # A CRITICAL alert (shell spawn, sensitive file read, root process) means
  # something unexpected happened in the pod during rollout — fail the pipeline
  # so the operator investigates before the deploy is considered safe.
  #
  # Gate is additive — it never interferes with the ZAP gate in Job 4.
  # Both gates must pass for the pipeline to go green on main.
  #
  # To enable: add GitHub secret HAS_FALCO_ENABLED = true
  # To disable: delete the secret or set it to anything other than "true"
  runtime-gate:
    name: Runtime Security Gate (Falco)
    runs-on: ubuntu-latest
    needs: deploy

    permissions:
      id-token: write
      contents: read

    # Hoist secret to job-level env — secrets context is not available in
    # step-level if: conditions (same pattern as HAS_ZAP_ENABLED in deploy job).
    env:
      HAS_FALCO_ENABLED: ${{ secrets.HAS_FALCO_ENABLED }}

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.HAS_EKS_CLUSTER == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GuardOps
        # Install the package itself (not just deps) so the `guardops` console
        # script is on PATH — the runtime gate calls `guardops runtime-status`.
        run: pip install -e ".[dev]" --quiet

      - name: Configure AWS credentials (OIDC)
        if: env.HAS_FALCO_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: guardops-runtime-gate-${{ github.run_id }}

      - name: Configure kubectl for EKS
        if: env.HAS_FALCO_ENABLED == 'true'
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name guardops-prod-cluster

      # 60s pause — Promtail has a flush interval before Falco logs appear in Loki.
      # Events fired at pod start during the Helm rollout need this buffer to
      # be queryable. Adjust down to 30s if Promtail flush is tuned lower.
      - name: Wait for Falco alert ingestion
        if: env.HAS_FALCO_ENABLED == 'true'
        run: sleep 60

      - name: Port-forward Loki
        if: env.HAS_FALCO_ENABLED == 'true'
        run: |
          kubectl port-forward svc/loki 3100:3100 -n monitoring &
          echo "LOKI_PF_PID=$!" >> $GITHUB_ENV
          sleep 5
          curl --silent --fail --retry 3 --retry-delay 2 \
            http://localhost:3100/ready \
            && echo "Loki is ready" \
            || echo "::warning::Loki not ready — runtime gate may produce incomplete results"

      - name: Run runtime security gate
        if: env.HAS_FALCO_ENABLED == 'true'
        run: |
          guardops runtime-status \
            --since 30m \
            --fail-on CRITICAL \
            --loki-url http://localhost:3100
        id: runtime-gate
        continue-on-error: true

      - name: Kill Loki port-forward
        if: always() && env.HAS_FALCO_ENABLED == 'true'
        run: kill "$LOKI_PF_PID" 2>/dev/null || true

      - name: Enforce runtime gate result
        if: env.HAS_FALCO_ENABLED == 'true'
        env:
          GATE_OUTCOME: ${{ steps.runtime-gate.outcome }}
        run: |
          if [ "$GATE_OUTCOME" == "failure" ]; then
            echo "::error::Runtime security gate FAILED — CRITICAL Falco alerts found."
            echo "::error::Review: Grafana -> Explore -> Loki -> {app=\"falco\"} | json"
            echo "::error::Or locally: guardops runtime-status --since 1h --severity CRITICAL"
            exit 1
          fi
          echo "Runtime security gate passed — no CRITICAL Falco alerts in the deploy window."

      - name: Runtime gate skipped (Falco not enabled)
        if: env.HAS_FALCO_ENABLED != 'true'
        run: |
          echo "Runtime gate skipped — set GitHub secret HAS_FALCO_ENABLED=true to enable."
          echo "Setup: .\\scripts\\setup-runtime-security.ps1"

  # ── Job 6: Upload Reports to S3 ──────────────────────────────────────────────
  upload-reports:
    name: Upload Reports to S3
    runs-on: ubuntu-latest
    needs: [sast, container-scan]

    permissions:
      id-token: write
      contents: read

    if: always() && vars.HAS_AWS_ROLE == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports/
        continue-on-error: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: guardops-upload-reports-${{ github.run_id }}

      - name: Upload reports to S3
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          S3_BUCKET: ${{ secrets.GUARDOPS_S3_BUCKET }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH="$REF_NAME"
          REPO="$REPO"
          RUN_ID="$RUN_ID"

          S3_PREFIX="s3://$S3_BUCKET/reports/${REPO}/${BRANCH}/${SHA}/${RUN_ID}"

          if [ -d "all-reports" ] && [ "$(ls -A all-reports)" ]; then
            aws s3 cp all-reports/ "${S3_PREFIX}/" \
              --recursive \
              --no-progress
            echo "Reports uploaded to: ${S3_PREFIX}/"
            echo ""
            echo "View in console: https://s3.console.aws.amazon.com/s3/buckets/$S3_BUCKET"
          else
            echo "No reports found to upload — this is OK if earlier jobs were skipped"
          fi

  # ── Job 7: ArgoCD Sync Gate (Phase 10) ───────────────────────────────────────
  #
  # Runs after the runtime-gate passes. Polls `guardops sync-status --env prod
  # --wait` until ArgoCD confirms the prod Application is Synced + Healthy,
  # or fails the pipeline if it doesn't reach that state within 300 seconds.
  #
  # WHY THIS JOB:
  #   The GitOps override commit in Job 4 triggers ArgoCD to start reconciling,
  #   but the push returns immediately without waiting for ArgoCD to finish.
  #   This job is the confirmation gate — it blocks the pipeline green until
  #   ArgoCD has actually applied the new image and pods are healthy.
  #
  # SKIP BEHAVIOUR:
  #   If ARGOCD_TOKEN is not set, the job prints a skip notice and exits 0.
  #   This means teams that haven't set up ArgoCD yet are not blocked — the
  #   gate is opt-in via the secret, consistent with HAS_ZAP_ENABLED and
  #   HAS_FALCO_ENABLED patterns in Jobs 4 and 5.
  #
  # The final "Print ArgoCD snapshot" step uses `if: always()` so the terminal
  # ArgoCD state is printed even when the wait step times out — gives the
  # operator something to look at without having to log into the ArgoCD UI.
  sync-gate:
    name: ArgoCD Sync Gate (prod)
    runs-on: ubuntu-latest
    needs: runtime-gate

    permissions:
      id-token: write
      contents: read

    # Hoist secret existence to job-level env — same pattern as HAS_ZAP_ENABLED
    # and HAS_FALCO_ENABLED. secrets context not allowed in step-level if:.
    env:
      HAS_ARGOCD: ${{ secrets.ARGOCD_TOKEN != '' && 'true' || 'false' }}

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.HAS_EKS_CLUSTER == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GuardOps CLI
        run: pip install -e ".[dev]" --quiet

      - name: Wait for ArgoCD — Synced + Healthy (prod)
        if: env.HAS_ARGOCD == 'true'
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          guardops sync-status \
            --env prod \
            --wait \
            --timeout 300

      - name: Print ArgoCD snapshot (always, for CI log visibility)
        if: always() && env.HAS_ARGOCD == 'true'
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: guardops sync-status --env prod

      - name: Sync gate skipped (ArgoCD not configured)
        if: env.HAS_ARGOCD == 'false'
        run: |
          echo "Sync gate skipped — ARGOCD_TOKEN secret not set."
          echo "To enable: gh secret set ARGOCD_TOKEN --body \"<token>\""
          echo "Generate a token: argocd account generate-token --account admin"