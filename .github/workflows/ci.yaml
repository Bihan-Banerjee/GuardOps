# .github/workflows/ci.yaml
#
# GuardOps CI/CD Pipeline — Phase 6
#
# Jobs:
#   1. build-test      — lint, type-check, unit tests, coverage
#   2. sast            — Semgrep + Bandit source code scanning
#   3. container-scan  — Docker build + Trivy image scan + ECR push
#   4. deploy          — Helm upgrade to EKS
#   5. upload-reports  — Push scan reports to S3 (always runs if AWS role exists)
#
# Security gates:
#   Job 2 blocks on HIGH+ SAST findings
#   Job 3 blocks on HIGH+ fixable container CVEs
#   Job 4 only runs if jobs 1-3 all pass AND branch is main AND EKS exists
#   Job 5 always runs so reports are saved even when pipeline fails
#
# Phase 6 change — GitHub OIDC replaces static IAM user credentials:
#   AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are REMOVED.
#   configure-aws-credentials now uses role-to-assume with a short-lived token.
#   Each job that calls AWS declares:  permissions: id-token: write
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN            — from `terraform output github_actions_role_arn`
#   AWS_ACCOUNT_ID          — your 12-digit account ID
#   GUARDOPS_S3_BUCKET      — bucket name from `terraform output s3_reports_bucket_name`
#   HAS_EKS_CLUSTER         — set to "true" when EKS is provisioned
#   SEMGREP_APP_TOKEN       — optional, for Semgrep cloud dashboard
#   SONAR_TOKEN             — optional, for SonarQube
#   SONAR_HOST_URL          — optional, for SonarQube
#   PYPI_API_TOKEN          — optional, for publishing to PyPI
#
# Secrets you can DELETE after applying Phase 6:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY

name: GuardOps CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # CHANGED: ap-south-1 (Mumbai) — closest to India, cheapest for you
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_NAME: guardops-app
  HELM_CHART_PATH: k8s/helm/guardops-app
  K8S_NAMESPACE: default

jobs:

  # ── Job 1: Build and Test ───────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check cli/ backend/

      - name: Type check with mypy
        run: mypy cli/ backend/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=cli --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Job 2: SAST ──────────────────────────────────────────────────────────────
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and security tools
        run: |
          pip install -r requirements.txt
          pip install semgrep bandit

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep --config=auto \
            --json \
            --output=security/reports/semgrep.json \
            --exclude=.venv \
            --exclude=tests \
            . || true

      - name: Check Semgrep results — gate on HIGH+
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "security/reports/semgrep.json"
          if not os.path.exists(report_path):
              print("No semgrep report found — skipping gate")
              sys.exit(0)

          try:
              data = json.load(open(report_path))
          except Exception as e:
              print(f"Could not parse semgrep report: {e} — skipping gate")
              sys.exit(0)

          blocking = [
              r for r in data.get("results", [])
              if r.get("extra", {}).get("severity") in ("ERROR", "WARNING")
          ]

          if blocking:
              print(f"BLOCKED: {len(blocking)} HIGH/MEDIUM semgrep findings")
              for f in blocking:
                  print(
                      f"  {f['extra']['severity']}  "
                      f"{f['check_id']}  "
                      f"{f['path']}:{f['start']['line']}"
                  )
              sys.exit(1)

          total = len(data.get("results", []))
          print(f"OK: {total} total semgrep findings, none blocking")
          EOF

      - name: Run Bandit
        run: |
          bandit -r . \
            --exclude .venv,venv,tests,infra,k8s,security,node_modules \
            -f json \
            -o security/reports/bandit.json \
            -l || true

      - name: Check Bandit results — gate on HIGH confidence HIGH severity
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "security/reports/bandit.json"
          if not os.path.exists(report_path):
              print("No bandit report found — skipping gate")
              sys.exit(0)

          try:
              data = json.load(open(report_path))
          except Exception as e:
              print(f"Could not parse bandit report: {e} — skipping gate")
              sys.exit(0)

          blocking = [
              r for r in data.get("results", [])
              if r.get("issue_severity") == "HIGH"
              and r.get("issue_confidence") != "LOW"
          ]

          if blocking:
              print(f"BLOCKED: {len(blocking)} HIGH-confidence HIGH-severity bandit findings")
              for f in blocking:
                  print(
                      f"  {f['issue_severity']} ({f['issue_confidence']})  "
                      f"{f['test_id']}  "
                      f"{f['filename']}:{f['line_number']}  "
                      f"{f['issue_text']}"
                  )
              sys.exit(1)

          total = len(data.get("results", []))
          print(f"OK: {total} total bandit findings, none blocking")
          EOF

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN not set — skipping SonarQube"
            exit 0
          fi

          pip install -e . --quiet

          python - <<'EOF'
          import os, sys
          from backend.security.sonarqube_runner import run_sonarqube, check_quality_gate

          result = run_sonarqube(".", {})

          if result.skipped:
              print(f"SonarQube skipped: {result.skip_reason}")
              sys.exit(0)

          if not result.success:
              print(f"SonarQube analysis failed: {result.error_message}")
              sys.exit(1)

          passed, message = check_quality_gate({})

          if not passed:
              print(f"BLOCKED: SonarQube quality gate FAILED: {message}")
              sys.exit(1)

          print("OK: SonarQube quality gate passed")
          EOF

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: security/reports/

  # ── Job 3: Container Scan + ECR Push ────────────────────────────────────────
  container-scan:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    needs: sast

    # Phase 6: id-token: write is required for GitHub OIDC token generation.
    # Without this, configure-aws-credentials cannot request the JWT.
    permissions:
      id-token: write   # request OIDC JWT
      contents: read    # checkout

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHA}" >> $GITHUB_OUTPUT
          echo "full_ref=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            test-project/

      # ── Phase 4.5: Cache Trivy DB ──────────────────────────────────────────
      # Prevents ghcr.io rate-limit errors on the vulnerability DB download.
      # Cache rotates daily (Trivy DB updates once per 24h).
      - name: Get current date for Trivy cache key
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      # ── End Phase 4.5 addition ─────────────────────────────────────────────

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.51.0

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Trivy image scan
        run: |
          trivy image \
            --format json \
            --output security/reports/trivy-image.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} || true

      - name: Check Trivy results — gate on fixable HIGH/CRITICAL
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "security/reports/trivy-image.json"
          if not os.path.exists(report_path):
              print("No trivy report found — skipping gate")
              sys.exit(0)

          try:
              data = json.load(open(report_path))
          except Exception as e:
              print(f"Could not parse trivy report: {e} — skipping gate")
              sys.exit(0)

          blocking = []
          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities") or []:
                  if (
                      vuln.get("Severity") in ("HIGH", "CRITICAL")
                      and vuln.get("FixedVersion")
                  ):
                      blocking.append(vuln)

          if blocking:
              print(f"BLOCKED: {len(blocking)} fixable HIGH/CRITICAL CVEs found")

              for v in blocking[:10]:
                  print(
                      f"  {v['Severity']}  "
                      f"{v['VulnerabilityID']}  "
                      f"{v['PkgName']}@{v['InstalledVersion']}  "
                      f"fix: {v['FixedVersion']}"
                  )

              if len(blocking) > 10:
                  print(f"  ... and {len(blocking) - 10} more")

              sys.exit(1)

          print("OK: no fixable HIGH/CRITICAL CVEs")
          EOF

      # ── Phase 6: OIDC auth — no static keys ───────────────────────────────
      # AWS_ROLE_ARN is set from `terraform output github_actions_role_arn`.
      # GitHub generates a short-lived JWT; this action exchanges it for
      # temporary STS credentials (valid ~1 hour). Nothing is stored.
      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: guardops-container-scan-${{ github.run_id }}

      - name: Login to ECR
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login \
                --username AWS \
                --password-stdin \
                ${{ env.ECR_REGISTRY }}

      - name: Create ECR repository if it doesn't exist
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.IMAGE_NAME }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null \
          || aws ecr create-repository \
              --repository-name ${{ env.IMAGE_NAME }} \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region ${{ env.AWS_REGION }}

      - name: Tag and push to ECR
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          FULL_REF="${{ steps.meta.outputs.full_ref }}"

          docker tag \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            "${FULL_REF}"

          docker push "${FULL_REF}"

          LATEST_REF="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} "${LATEST_REF}"
          docker push "${LATEST_REF}"

          echo "Successfully pushed: ${FULL_REF}"
          echo "Also tagged latest: ${LATEST_REF}"
      # ── End Phase 6 OIDC block ────────────────────────────────────────────

      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-report
          path: security/reports/trivy-image.json


  # ── Job 4: Helm Deploy to EKS ────────────────────────────────────────────────
  # PHASE 4A: This job is DISABLED.
  # It is guarded by the HAS_EKS_CLUSTER secret which you must explicitly set
  # to "true" in GitHub → Settings → Secrets after provisioning EKS.
  # Until then, every push skips this job silently.
  #
  # PHASE 4B: To enable:
  #   1. Run `terraform apply` with VPC + IAM + EKS modules uncommented
  #   2. Go to GitHub → Settings → Secrets → New secret
  #      Name: HAS_EKS_CLUSTER   Value: true
  #   3. The next push to main will trigger this job automatically.
  deploy:
    name: Deploy to EKS (Helm)
    runs-on: ubuntu-latest
    needs: container-scan

    # Phase 6: OIDC requires id-token: write
    permissions:
      id-token: write
      contents: read

    # Triple guard: main branch only + push event only + EKS cluster exists
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      secrets.HAS_EKS_CLUSTER == 'true'

    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: guardops-deploy-${{ github.run_id }}

      - name: Configure kubectl for EKS
        run: |
          # PHASE 4B: update this cluster name to match your EKS cluster.
          # Find it with: terraform output eks_cluster_name
          # Or: aws eks list-clusters --region ap-south-1
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name guardops-prod-cluster

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.17.0"

      - name: Helm lint — validate chart before deploying
        run: |
          helm lint ${{ env.HELM_CHART_PATH }} \
            --set image.repository=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.container-scan.outputs.image-tag }}

      - name: Deploy with Helm
        run: |
          IMAGE_REPO="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG="${{ needs.container-scan.outputs.image-tag }}"

          helm upgrade --install guardops-app \
            ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=Always \
            -f ${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --wait

          echo "Helm release status:"
          helm status guardops-app --namespace ${{ env.K8S_NAMESPACE }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/guardops-app \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

          echo ""
          echo "Pod status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

          echo ""
          echo "Helm history:"
          helm history guardops-app --namespace ${{ env.K8S_NAMESPACE }}

      # ── Phase 6: OWASP ZAP DAST ──────────────────────────────────────────
      # Runs AFTER the rollout is confirmed healthy. Uses kubectl port-forward
      # to expose the service locally so ZAP can reach it without needing a
      # public LB URL (which may take time to provision).
      #
      # Scan mode: baseline (passive) — no attack payloads, safe for prod.
      # Gate: CRITICAL findings (ZAP High → CRITICAL in our scale) → rollback.
      # HIGH/MEDIUM/LOW findings are reported but do not block.
      #
      # To disable: remove the HAS_ZAP_ENABLED secret or set it to anything
      # other than "true". The step is a no-op without it.

      - name: Port-forward app for ZAP
        if: ${{ secrets.HAS_ZAP_ENABLED == 'true' }}
        run: |
          # Forward the deployed service to localhost:8090.
          # Port 8090 avoids clashing with anything already on 8080.
          kubectl port-forward \
            svc/${{ env.IMAGE_NAME }} \
            8090:8080 \
            -n ${{ env.K8S_NAMESPACE }} &
          echo "PORT_FORWARD_PID=$!" >> $GITHUB_ENV

          # Give the tunnel 8 seconds to stabilise before ZAP starts spidering
          sleep 8

          # Smoke-test: confirm the app is actually responding before handing
          # the URL to ZAP. A non-200 here means the pod isn't healthy yet.
          curl --silent --fail --retry 3 --retry-delay 3 \
            http://localhost:8090/healthz \
            && echo "Health check passed — proceeding to ZAP scan" \
            || (echo "::warning::Health check failed — ZAP may produce unreliable results" && true)

      - name: Run OWASP ZAP baseline scan
        if: ${{ secrets.HAS_ZAP_ENABLED == 'true' }}
        run: |
          mkdir -p security/reports

          # owasp/zap2docker-stable flags:
          #   -t   target URL
          #   -J   JSON report path (relative to /zap/wrk mount)
          #   -r   HTML report path (relative to /zap/wrk mount)
          #   -I   ignore (don't fail) on WARN-level findings — we gate ourselves
          #   -l WARN   include WARN+ alerts, suppress INFO noise
          #
          # Exit codes: 0=no alerts, 1=warn alerts found, 2=ZAP internal error.
          # We use `|| true` so the step never fails here — gating is in the
          # next step where we can produce a structured error message.

          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/security/reports:/zap/wrk:rw" \
            owasp/zap2docker-stable \
            zap-baseline.py \
            -t http://localhost:8090 \
            -J zap-report.json \
            -r zap-report.html \
            -I \
            -l WARN \
          || true

      - name: Kill port-forward
        if: ${{ secrets.HAS_ZAP_ENABLED == 'true' && always() }}
        run: kill ${{ env.PORT_FORWARD_PID }} 2>/dev/null || true

      - name: Upload ZAP report artifact
        if: ${{ secrets.HAS_ZAP_ENABLED == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: security/reports/zap-report.*
          if-no-files-found: warn

      - name: Gate on DAST severity + auto-rollback on CRITICAL
        if: ${{ secrets.HAS_ZAP_ENABLED == 'true' }}
        # Language: plain Python inline — no extra deps, runs on ubuntu-latest
        run: |
          python3 - << 'PYEOF'
          import json
          import sys
          from pathlib import Path

          RISK_MAP = {3: "CRITICAL", 2: "HIGH", 1: "MEDIUM", 0: "LOW"}
          FAIL_ON = "CRITICAL"   # auto-rollback threshold — mirrors zap_fail_on in config

          report_path = Path("security/reports/zap-report.json")

          if not report_path.exists():
              print("::error::ZAP JSON report not found. The scan may have failed to start.")
              print("::error::Check that Docker is available and the target URL was reachable.")
              sys.exit(1)

          try:
              data = json.loads(report_path.read_text())
          except json.JSONDecodeError as exc:
              print(f"::error::Could not parse ZAP report: {exc}")
              sys.exit(1)

          counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
          top_findings = []

          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  sev = RISK_MAP.get(int(alert.get("riskcode", 0)), "LOW")
                  counts[sev] += 1
                  if sev in ("CRITICAL", "HIGH"):
                      top_findings.append(f"  {sev}: {alert.get('alert', 'Unknown')}")

          summary = (
              f"DAST results — "
              f"CRITICAL: {counts['CRITICAL']}  "
              f"HIGH: {counts['HIGH']}  "
              f"MEDIUM: {counts['MEDIUM']}  "
              f"LOW: {counts['LOW']}"
          )
          print(summary)

          if top_findings:
              print("Top findings (CRITICAL + HIGH):")
              for f in top_findings[:10]:
                  print(f)

          if counts[FAIL_ON] > 0:
              print(f"\n::error::ZAP DAST found {counts[FAIL_ON]} {FAIL_ON} findings on the live application.")
              print("::error::Triggering Helm rollback — see next step.")
              # Write a flag file that the rollback step reads
              Path("/tmp/zap_critical_found").write_text(str(counts[FAIL_ON]))
              sys.exit(1)

          print("DAST gate passed — no CRITICAL findings.")
          PYEOF
        id: zap-gate
        continue-on-error: true   # allow rollback step to always run after this

      - name: Auto-rollback on CRITICAL DAST findings
        # Only runs if the gate step detected CRITICAL findings
        if: steps.zap-gate.outcome == 'failure' && secrets.HAS_ZAP_ENABLED == 'true'
        run: |
          echo "Rolling back Helm release due to CRITICAL DAST findings..."

          # Roll back to the previous revision (0 = previous in helm rollback)
          helm rollback guardops-app 0 \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --wait \
            --timeout 3m

          echo "Rollback complete. Helm history after rollback:"
          helm history guardops-app --namespace ${{ env.K8S_NAMESPACE }}

          echo "Pod status after rollback:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

          # Fail the job so the pipeline is red — deploy + DAST together are the gate
          echo "::error::Deployment rolled back due to CRITICAL DAST findings."
          echo "::error::Review the ZAP report in the zap-dast-report artifact and fix before re-deploying."
          exit 1
      # ── End Phase 6 DAST block ─────────────────────────────────────────────

  # ── Job 5: Upload Reports to S3 ──────────────────────────────────────────────
  upload-reports:
    name: Upload Reports to S3
    runs-on: ubuntu-latest
    needs: [sast, container-scan]

    # Phase 6: OIDC requires id-token: write
    permissions:
      id-token: write
      contents: read

    # Always run so reports are saved even when earlier jobs fail.
    # Guard changed from AWS_ACCESS_KEY_ID check → AWS_ROLE_ARN check
    if: always() && secrets.AWS_ROLE_ARN != ''

    steps:
      - uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports/
        continue-on-error: true   # don't fail if earlier jobs produced no artifacts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: guardops-upload-reports-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload reports to S3
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"

          # Path structure: reports/<repo>/<branch>/<sha>/<run_id>/
          # Including run_id means multiple runs on the same SHA don't overwrite each other.
          S3_PREFIX="s3://${{ secrets.GUARDOPS_S3_BUCKET }}/reports/${REPO}/${BRANCH}/${SHA}/${RUN_ID}"

          if [ -d "all-reports" ] && [ "$(ls -A all-reports)" ]; then
            aws s3 cp all-reports/ "${S3_PREFIX}/" \
              --recursive \
              --no-progress

            echo "Reports uploaded to: ${S3_PREFIX}/"
            echo ""
