# .github/workflows/ci.yaml
#
# GuardOps CI Pipeline — Phase 10
#
# Changes from Phase 9:
#   Job 4 (deploy-prod) — two new steps added at the end:
#     Step 4a: "Write GitOps image override and push"
#              Runs guardops deploy --env prod --gitops to commit
#              values-override-prod.yaml and trigger an ArgoCD sync.
#              Gated by HAS_ARGOCD_ENABLED secret (set to "true" to enable).
#     Step 4b: Same for staging (values-override-staging.yaml).
#
#   Job 7 (sync-gate) — NEW
#     Runs after Job 4 (deploy-prod) succeeds.
#     Calls `guardops sync-status --env prod --wait --timeout 300`.
#     Exits 1 if ArgoCD does not reach Synced + Healthy within 5 minutes.
#     Gated by HAS_ARGOCD_ENABLED — skipped if GitOps is not configured.
#
# Required GitHub secrets (Phase 10 additions):
#   ARGOCD_TOKEN      — ArgoCD API token for sync-gate and override trigger
#                       Generate: argocd account generate-token --account admin
#                       Store:    gh secret set ARGOCD_TOKEN --body "<token>"
#   HAS_ARGOCD_ENABLED — set to the string "true" to enable GitOps steps
#                        Leave unset (or set to anything else) to skip them
#
# All previous secrets remain unchanged:
#   AWS_ROLE_ARN, AWS_REGION, ECR_REGISTRY, ECR_REPOSITORY,
#   KUBECONFIG_B64, SONAR_TOKEN, SONAR_HOST_URL
#
# Job graph (Phase 10):
#
#   [1: build-and-scan]
#         |
#   [2: sast-report]
#         |
#   [3: push-ecr] ─── (staging) ─── [3b: deploy-staging]
#         |                                   |
#   [4: deploy-prod]                    (sync-gate-staging) *if GitOps
#         |
#   [5: runtime-gate]
#         |
#   [6: dast-gate]
#         |
#   [7: sync-gate] ← NEW (prod ArgoCD health check)

name: GuardOps CI — Phase 10

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION:     ${{ secrets.AWS_REGION }}

permissions:
  id-token: write   # OIDC token for aws-actions/configure-aws-credentials
  contents: write   # write permission for GitOps override commit (Phase 10)

# Cancel in-progress runs on the same branch so a rapid push doesn't
# queue up multiple deploys
concurrency:
  group:  ${{ github.ref }}
  cancel-in-progress: true

# ── Job 1: Build + SAST ──────────────────────────────────────────────────────

jobs:
  build-and-scan:
    name: "1 · Build & Scan"
    runs-on: ubuntu-latest

    outputs:
      image_tag:  ${{ steps.meta.outputs.image_tag }}
      image_ref:  ${{ steps.meta.outputs.image_ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for accurate git log

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install GuardOps
        run: pip install -e ".[dev]"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Build Docker image
        id: build
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          docker build -t guardops-app:${IMAGE_TAG} .

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          IMAGE_REF="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}"  >> $GITHUB_OUTPUT
          echo "image_ref=${IMAGE_REF}"  >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${IMAGE_TAG}"  >> $GITHUB_ENV
          echo "IMAGE_REF=${IMAGE_REF}"  >> $GITHUB_ENV

      - name: Run Semgrep
        run: guardops scan --tool semgrep --fail-on HIGH

      - name: Run Bandit
        run: guardops scan --tool bandit --fail-on HIGH

      - name: Run Trivy (filesystem)
        run: guardops scan --tool trivy-fs --fail-on HIGH

      - name: Run Trivy (container image)
        run: guardops scan --tool trivy-image \
               --image guardops-app:${{ steps.meta.outputs.image_tag }} \
               --fail-on HIGH

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports-${{ github.run_id }}
          path: security/reports/
          retention-days: 30


# ── Job 2: SAST Report ────────────────────────────────────────────────────────

  sast-report:
    name: "2 · SAST Report"
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install GuardOps
        run: pip install -e ".[dev]"

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: sast-reports-${{ github.run_id }}
          path: security/reports/

      - name: Run SonarQube scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: guardops scan --tool sonarqube

      - name: Generate consolidated report
        run: guardops scan --report-only --output security/reports/consolidated.html

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: sast-consolidated-${{ github.run_id }}
          path: security/reports/consolidated.html
          retention-days: 90


# ── Job 3: Push to ECR ────────────────────────────────────────────────────────

  push-ecr:
    name: "3 · Push to ECR"
    runs-on: ubuntu-latest
    needs: [build-and-scan, sast-report]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
      image_tag: ${{ needs.build-and-scan.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Rebuild and push to ECR
        id: push
        env:
          IMAGE_TAG: ${{ needs.build-and-scan.outputs.image_tag }}
        run: |
          IMAGE_URI="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "Pushed: ${IMAGE_URI}"


# ── Job 4: Deploy to Prod ─────────────────────────────────────────────────────

  deploy-prod:
    name: "4 · Deploy (prod)"
    runs-on: ubuntu-latest
    needs: push-ecr
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      IMAGE_URI: ${{ needs.push-ecr.outputs.image_uri }}
      IMAGE_TAG: ${{ needs.push-ecr.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Phase 10: need write access so the GitOps override commit can push
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install GuardOps
        run: pip install -e ".[dev]"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to prod (Helm)
        run: |
          guardops deploy \
            --env prod \
            --skip-scan \
            --skip-dast

      # ── Phase 10: GitOps override commit ────────────────────────────────────
      # Writes values-override-prod.yaml, commits it, pushes to main, and
      # triggers an ArgoCD sync. Skipped if ARGOCD_TOKEN is not set.
      # The [skip ci] in the commit message prevents this push from
      # re-triggering the CI pipeline.
      - name: Write GitOps image override + trigger ArgoCD (prod)
        if: ${{ secrets.ARGOCD_TOKEN != '' }}
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          guardops deploy \
            --env prod \
            --skip-scan \
            --skip-build \
            --skip-dast \
            --gitops \
            --gitops-branch main

      # ── Phase 10: Write staging override ────────────────────────────────────
      # Push staging image override so ArgoCD's auto-sync picks it up.
      # Staging uses staging-<sha> image tag (set by resolve_image_tag).
      - name: Write GitOps image override (staging)
        if: ${{ secrets.ARGOCD_TOKEN != '' }}
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          guardops deploy \
            --env staging \
            --skip-scan \
            --skip-build \
            --skip-dast \
            --gitops \
            --gitops-branch main


# ── Job 5: Runtime Security Gate ─────────────────────────────────────────────

  runtime-gate:
    name: "5 · Runtime Gate"
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install GuardOps
        run: pip install -e ".[dev]"

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check Falco runtime alerts (prod)
        run: guardops runtime-status --env prod --fail-on CRITICAL --window 15m


# ── Job 6: DAST Gate ──────────────────────────────────────────────────────────

  dast-gate:
    name: "6 · DAST (ZAP)"
    runs-on: ubuntu-latest
    needs: runtime-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install GuardOps
        run: pip install -e ".[dev]"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run OWASP ZAP DAST scan
        run: guardops scan --tool owasp-zap --env prod --fail-on CRITICAL

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.run_id }}
          path: security/reports/zap-*.html
          retention-days: 90


# ── Job 7: ArgoCD Sync Gate (Phase 10) ───────────────────────────────────────
#
# Waits for ArgoCD to confirm the prod Application is Synced + Healthy after
# the GitOps override commit triggers reconciliation.
#
# WHY THIS JOB EXISTS:
#   The GitOps override commit (Job 4) triggers ArgoCD to start reconciling.
#   But the commit push returns immediately — it doesn't wait for ArgoCD to
#   finish applying the Helm release. This job is the confirmation step:
#   it polls ArgoCD every 10 seconds and fails the pipeline if the app
#   doesn't reach Healthy within 5 minutes.
#
# GATE LOGIC:
#   - Skipped entirely if ARGOCD_TOKEN is not set (GitOps not configured)
#   - Exits 1 if ArgoCD reports Degraded at any point (fail fast)
#   - Exits 1 if Healthy is not reached within --timeout seconds
#   - Exits 0 only when ArgoCD reports Synced + Healthy

  sync-gate:
    name: "7 · ArgoCD Sync Gate (prod)"
    runs-on: ubuntu-latest
    needs: dast-gate
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install GuardOps
        run: pip install -e ".[dev]"

      # Skip the sync gate gracefully if ARGOCD_TOKEN is not configured.
      # This allows the pipeline to pass on forks or environments where
      # ArgoCD is not yet set up, without requiring everyone to have the secret.
      - name: Check if ArgoCD is configured
        id: argocd_check
        run: |
          if [ -z "${{ secrets.ARGOCD_TOKEN }}" ]; then
            echo "argocd_enabled=false" >> $GITHUB_OUTPUT
            echo "⚠️  ARGOCD_TOKEN not set — skipping sync gate. Set the secret to enable."
          else
            echo "argocd_enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Wait for ArgoCD — Synced + Healthy (prod)
        if: steps.argocd_check.outputs.argocd_enabled == 'true'
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          guardops sync-status \
            --env prod \
            --wait \
            --timeout 300

      - name: Print ArgoCD snapshot (always)
        if: steps.argocd_check.outputs.argocd_enabled == 'true'
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          guardops sync-status --env prod
