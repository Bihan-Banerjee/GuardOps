name: Publish to PyPI

on:
  release:
    types: [published]   # only triggers when you create a GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi    # requires manual approval in GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify version matches tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"          # e.g. v0.2.0
          VERSION="${TAG#v}"                     # strips the v → 0.2.0
          PKG_VERSION=$(python -c "import cli; print(cli.__version__)")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
