[project]
name = "guardops"
version = "1.0.1"
description = "Autonomous DevSecOps CLI — build, scan, deploy, and monitor runtime security"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bihan Banerjee", email = "bihanbanerjee26@gmail.com" }
]
keywords = [
    "devsecops", "security", "kubernetes", "devops", "cli",
    "falco", "runtime-security", "argocd", "gitops", "cert-manager",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7,<14.0",
    "pyyaml>=6.0.1",
    "requests>=2.31",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    # Transitive security floors (pulled via requests/boto3) — patched versions:
    #   urllib3 >=2.7.0  (PYSEC-2026-141, PYSEC-2026-142)
    #   idna    >=3.15   (CVE-2026-45409)
    "urllib3>=2.7.0",
    "idna>=3.15",
]

[project.optional-dependencies]
# Web dashboard backend (Phase 13). Optional so `pip install guardops` stays lean —
# only needed to run `guardops dashboard` or the in-cluster service.
dashboard = [
    # Pinned near the tested versions for reproducibility. fastapi>=0.116 is
    # required so starlette can reach a patched release (older fastapi capped
    # starlette<0.47.0); starlette 1.2.x fixes CVE-2025-54121 / CVE-2025-62727 /
    # PYSEC-2026-161. Bump these deliberately, re-running the dashboard tests.
    "fastapi>=0.136,<0.137",
    "starlette>=1.2,<1.3",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    # dashboard deps so the dashboard API + auth tests run in the dev/CI env
    "fastapi>=0.136,<0.137",
    "starlette>=1.2,<1.3",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.urls]
Homepage   = "https://github.com/Bihan-Banerjee/GuardOps"
Repository = "https://github.com/Bihan-Banerjee/GuardOps"
"Bug Tracker" = "https://github.com/Bihan-Banerjee/GuardOps/issues"
Changelog  = "https://github.com/Bihan-Banerjee/GuardOps/blob/main/changelog.md"

[project.scripts]
guardops = "cli.main:cli"

[build-system]
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "backend*"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "--tb=short -q"

[tool.ruff]
line-length = 100
