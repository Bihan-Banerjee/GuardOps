[project]
name = "guardops"
version = "0.9.0"
description = "Autonomous DevSecOps CLI — build, scan, deploy, and monitor runtime security"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bihan Banerjee", email = "bihanbanerjee26@gmail.com" }
]
keywords = ["devsecops", "security", "kubernetes", "devops", "cli", "falco", "runtime-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7,<14.0",
    "pyyaml>=6.0.1",
    "requests>=2.31",      # used by falco_reader.py (Loki HTTP) + existing code
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Bihan-Banerjee/GuardOps"
Repository = "https://github.com/Bihan-Banerjee/GuardOps"
"Bug Tracker" = "https://github.com/Bihan-Banerjee/GuardOps/issues"

[project.scripts]
guardops = "cli.main:cli"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
