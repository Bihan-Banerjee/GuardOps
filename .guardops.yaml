project:
  name: test-app
  description: ''
  cloud: local

docker:
  dockerfile: Dockerfile
  context: .
  registry: local
  image_name: test-app

kubernetes:
  namespace: default
  cluster_context: k3d-guardops-local
  deployment_name: test-app

security:
  fail_on_severity: HIGH      # pre-deploy SAST gate (Semgrep, Bandit, Trivy)
  report_dir: security/reports

  tools:
    semgrep: true
    bandit: true
    trivy: true
    sonarqube: false
    owasp_zap: false          # set to true in prod to enable Phase 6 DAST

  # ── DAST (Phase 6) ──────────────────────────────────────────────────────
  # owasp_zap must be true above for these to take effect.
  #
  # zap_target_url: explicit target for `guardops deploy` local runs.
  #   Leave empty ("") to auto-detect from deploy_result.service_url (recommended
  #   for prod — the deployer knows the URL after Helm finishes).
  #
  # zap_fail_on: severity that blocks the deploy and triggers auto-rollback.
  #   CRITICAL = ZAP High findings (confirmed HTTP-level vulnerabilities).
  #   Set to HIGH to also block on ZAP Medium findings (more aggressive).
  #
  # zap_timeout_seconds: max time to wait for ZAP scan to complete.
  #   300s (5 min) is sufficient for most baseline scans. Increase for large apps.

  zap_target_url: ""          # e.g. "http://my-app.example.com" for manual override
  zap_fail_on: CRITICAL       # CRITICAL | HIGH | MEDIUM | LOW
  zap_timeout_seconds: 300    # seconds before ZAP scan is forcibly killed

monitoring:
  grafana_url: ''
  prometheus_url: ''
  loki_url: ''                # set after Phase 7 setup, e.g. 'http://localhost:3100'
                              # get the in-cluster URL from: terraform output falco_loki_url
                              # or run: .\scripts\setup-runtime-security.ps1

# ── Runtime Security (Phase 7) ──────────────────────────────────────────────
# Controls `guardops runtime-status` behaviour.
#
# enabled: master switch. When false, runtime-status exits with a setup hint
#   instead of querying Loki. Set to true after Falco + Loki are deployed.
#
# falco_alert_window: default time window for `guardops runtime-status`.
#   Passed as --since if not overridden on the CLI. 1h is a good starting
#   point for post-deploy checks; use 24h for morning review.
#
# alert_fail_on: severity threshold for `--fail-on` in CI runtime gate jobs.
#   CRITICAL = only alert on confirmed shell spawns / file reads (low noise).
#   HIGH     = also gate on ERROR-priority Falco events (more defensive).
#
# namespaces_to_watch: if set, `guardops runtime-status` defaults to
#   filtering these namespaces. Leave empty [] to query all namespaces.
#   Equivalent to passing --namespace on the CLI each time.

runtime_security:
  enabled: false              # set true after .\scripts\setup-runtime-security.ps1
  falco_alert_window: 1h      # default --since for runtime-status
  alert_fail_on: CRITICAL     # default --fail-on for CI gate
  namespaces_to_watch: []     # e.g. [default, production]
